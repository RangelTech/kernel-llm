name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_llm
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (unit + integration)
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/agent_llm
        run: python -m pytest -q -m "integration or not integration"

  # Split de repo (agent-llm mega spec, infra-05): este repo era `kernel/`
  # dentro do monorepo agent-platform. Mesmo padrão de deploy (Workload
  # Identity Federation, sem chave de service account guardada como secret) —
  # o provedor OIDC foi estendido pra aceitar token deste repo também
  # (attribute-condition no pool github-actions, GCP eduk-prd-lake).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: eduk-prd-lake
          workload_identity_provider: projects/188258617713/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@eduk-prd-lake.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy kernel
        env:
          KERNEL_INTERNAL_TOKEN: ${{ secrets.KERNEL_INTERNAL_TOKEN }}
        run: bash ./infra/deploy.sh kernel
