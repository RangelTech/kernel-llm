name: Deploy kernel to Cloud Run

# CI/CD real (infra-01/infra-03, 21/08/2026): substitui o deploy manual
# (`infra/deploy.sh`, gcloud rodado na mao). Auth GCP via Workload Identity
# Federation -- sem chave de SA em secret nenhum, o GitHub troca o token
# OIDC do proprio run por uma identidade de curta duracao (pool ja existe:
# projeto rangel-tech, condicionado a repository_owner=='RangelTech',
# qualquer repo do org usa o mesmo).
#
# Todo segredo de aplicacao vem do Infisical (projeto "kernel-llm", env
# prod) via Machine Identity propria (Universal Auth) -- unicos 2 secrets
# deste repo no GitHub sao INFISICAL_CLIENT_ID/INFISICAL_CLIENT_SECRET.
# Trocar um valor no Infisical + rodar este workflow (push ou dispatch) e
# o unico jeito de propagar pra producao.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/cloudbuild-kernel.yaml"
      - "Dockerfile"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          fetch_secret() {
            local name="$1"
            local value
            value=$(curl -fsS "https://infisical.rangeltech.net/api/v3/secrets/raw/$name?workspaceId=2f4dbe1b-2bde-4159-9ecb-d89710b47543&environment=prod&secretPath=%2F" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Secret $name not found in Infisical" >&2
              exit 1
            fi
            echo "::add-mask::$value" >&2
            echo "$value"
          }

          {
            echo "database_url<<EOF_DB"
            fetch_secret DATABASE_URL
            echo "EOF_DB"
            echo "s3_access_key_id<<EOF_S3A"
            fetch_secret S3_ACCESS_KEY_ID
            echo "EOF_S3A"
            echo "s3_secret_access_key<<EOF_S3S"
            fetch_secret S3_SECRET_ACCESS_KEY
            echo "EOF_S3S"
            echo "internal_token<<EOF_TOK"
            fetch_secret INTERNAL_TOKEN
            echo "EOF_TOK"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          gcloud builds submit --project=rangel-tech \
            --config=infra/cloudbuild-kernel.yaml \
            --substitutions=SHORT_SHA=${{ github.sha }} .

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ steps.infisical.outputs.database_url }}
          S3_ACCESS_KEY_ID: ${{ steps.infisical.outputs.s3_access_key_id }}
          S3_SECRET_ACCESS_KEY: ${{ steps.infisical.outputs.s3_secret_access_key }}
          INTERNAL_TOKEN: ${{ steps.infisical.outputs.internal_token }}
        run: |
          # Cloud Run recusa trocar um env var de "secret ref" pra "literal"
          # no mesmo comando (achado real, 21/08/2026) -- esses 4 ainda
          # estavam registrados como --set-secrets de deploys anteriores
          # (GCP Secret Manager), agora vem literal do Infisical.
          gcloud run services update kernel-llm \
            --project=rangel-tech --region=us-central1 \
            --remove-secrets=DATABASE_URL,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,INTERNAL_TOKEN 2>/dev/null || true
          gcloud run deploy kernel-llm \
            --project=rangel-tech --region=us-central1 \
            --image=us-central1-docker.pkg.dev/rangel-tech/containers/teste_ia-kernel:${{ github.sha }} \
            --update-env-vars="ENABLE_STUB_CONTROL=false,STORAGE_BACKEND=s3,S3_BUCKET=rangel-tech-storage,S3_ENDPOINT_URL=https://storage.googleapis.com,S3_PUBLIC_BASE_URL=https://storage.googleapis.com/rangel-tech-storage/teste-ia,S3_REGION=us-east-1,S3_PREFIX=teste-ia/agent-llm,AWS_REQUEST_CHECKSUM_CALCULATION=when_required,AWS_RESPONSE_CHECKSUM_VALIDATION=when_required,DATABASE_URL=$DATABASE_URL,S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY,INTERNAL_TOKEN=$INTERNAL_TOKEN" \
            --allow-unauthenticated \
            --memory=1Gi --cpu=1 --min-instances=0 --max-instances=3 \
            --timeout=600

      - name: Smoke check
        run: |
          URL=$(gcloud run services describe kernel-llm --project=rangel-tech --region=us-central1 --format='value(status.url)')
          curl -fsS "$URL/health" | grep -q '"status":"ok"'
