name: Deploy kernel to Cloud Run

# CI/CD real (infra-01/infra-03, 21/08/2026): substitui o deploy manual
# (`infra/deploy.sh`, gcloud rodado na mão). Auth via Workload Identity
# Federation -- SEM chave de service account em secret nenhum, o GitHub
# troca o token OIDC do próprio run por uma identidade de curta duração
# (pool já existe: projeto rangel-tech, condicionado a
# repository_owner=='RangelTech', qualquer repo do org usa o mesmo).
#
# KERNEL_INTERNAL_TOKEN não está no Infisical ainda (kernel-llm não tem
# projeto lá -- infra-03, pendência real até alguém com acesso de org no
# Infisical criar o projeto). Fica em GCP Secret Manager por enquanto,
# lido direto pelo --set-secrets no deploy (não precisa estar disponível
# neste workflow, só referenciado pelo nome).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/cloudbuild-kernel.yaml"
      - "Dockerfile"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image
        run: |
          gcloud builds submit --project=rangel-tech \
            --config=infra/cloudbuild-kernel.yaml \
            --substitutions=SHORT_SHA=${{ github.sha }} .

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update kernel-llm \
            --project=rangel-tech --region=us-central1 \
            --remove-secrets=INTERNAL_TOKEN 2>/dev/null || true
          gcloud run deploy kernel-llm \
            --project=rangel-tech --region=us-central1 \
            --image=us-central1-docker.pkg.dev/rangel-tech/containers/teste_ia-kernel:${{ github.sha }} \
            --set-secrets=DATABASE_URL=kernel-database-url:latest,S3_ACCESS_KEY_ID=gcs-hmac-access-key:latest,S3_SECRET_ACCESS_KEY=gcs-hmac-secret-key:latest,INTERNAL_TOKEN=kernel-internal-token:latest \
            --set-env-vars="ENABLE_STUB_CONTROL=false,STORAGE_BACKEND=s3,S3_BUCKET=rangel-tech-storage,S3_ENDPOINT_URL=https://storage.googleapis.com,S3_PUBLIC_BASE_URL=https://storage.googleapis.com/rangel-tech-storage/teste-ia,S3_REGION=us-east-1,S3_PREFIX=teste-ia/agent-llm,AWS_REQUEST_CHECKSUM_CALCULATION=when_required,AWS_RESPONSE_CHECKSUM_VALIDATION=when_required" \
            --allow-unauthenticated \
            --memory=1Gi --cpu=1 --min-instances=0 --max-instances=3 \
            --timeout=600

      - name: Smoke check
        run: |
          URL=$(gcloud run services describe kernel-llm --project=rangel-tech --region=us-central1 --format='value(status.url)')
          curl -fsS "$URL/health" | grep -q '"status":"ok"'
